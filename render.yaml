services:
  - type: web
    name: senior-ai-api
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3333
      - key: DATABASE_URL
        fromDatabase:
          name: senior-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 2d
      - key: JWT_ID
        value: senior-ai-api
      # URLs dos fronts publicados, separadas por virgula (preencher no painel do Render)
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: senior-ai-db
    plan: free
    region: oregon
